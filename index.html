<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Lax Bowl 2D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #090d16;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 900px;
            background: #111827;
            border: 3px solid #38bdf8;
            border-bottom: none;
            padding: 10px 25px;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 -4px 20px rgba(56, 189, 248, 0.2);
        }
        .score-box { text-align: center; }
        .score-label { font-size: 0.8rem; color: #38bdf8; text-transform: uppercase; font-weight: bold; }
        .score-val { font-size: 1.8rem; font-weight: 900; color: #f8fafc; }

        #gameCanvas {
            background: #15803d;
            border: 3px solid #38bdf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            cursor: crosshair;
        }

        #status-bar {
            width: 900px;
            background: #111827;
            border: 3px solid #38bdf8;
            border-top: none;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #f1f5f9;
            border-radius: 0 0 12px 12px;
            font-weight: bold;
        }

        #meter-container {
            position: absolute;
            bottom: 65px;
            width: 280px;
            height: 20px;
            background: #0f172a;
            border: 2px solid #ffffff;
            border-radius: 10px;
            overflow: hidden;
            display: none;
            box-shadow: 0 0 12px #38bdf8;
        }
        #meter-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #22c55e, #ef4444); }

        #popup-effect {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-size: 3rem;
            font-weight: 900;
            color: #facc15;
            text-shadow: 3px 3px 0px #000, 0 0 20px #facc15;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease-out;
            text-align: center;
            z-index: 50;
        }
        #popup-effect.active {
            transform: translate(-50%, -50%) scale(1.1);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="score-box"><div class="score-label">HOME (BLUE)</div><div id="score-user" class="score-val">0</div></div>
        <div class="score-box"><div class="score-label">PERIOD</div><div id="game-period" class="score-val">1 / 3</div></div>
        <div class="score-box"><div class="score-label">CLOCK</div><div id="game-clock" class="score-val">02:00</div></div>
        <div class="score-box"><div class="score-label">AWAY (ORANGE)</div><div id="score-ai" class="score-val">0</div></div>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <div id="status-bar">
        WASD: Move | Mouse: Aim | Space: Hold to Charge Pass/Shot (Press near enemy to CHECK) | F: Quick Shot
    </div>

    <div id="meter-container"><div id="meter-bar"></div></div>
    <div id="popup-effect">GOAL!</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const CW = canvas.width;  // 900
const CH = canvas.height; // 500

const GOAL_LEFT_X = 50;
const GOAL_RIGHT_X = CW - 50;
const GOAL_HEIGHT = 100;

let period = 1, clockTime = 120, userScore = 0, aiScore = 0;
let gameState = "OFFENSE";
let meterPower = 0, meterCharging = false, meterDir = 1;
let keyState = {}, mousePos = { x: CW / 2, y: CH / 2 };

// --- PLAYER CLASS ---
class Player {
    constructor(x, y, team, isGoalie = false, number = 1) {
        this.x = x;
        this.y = y;
        this.team = team;
        this.isGoalie = isGoalie;
        this.number = number;
        this.radius = 15;
        // User speed boosted to 4.0; AI speed nerfed to 2.5
        this.speed = team === 'user' ? (isGoalie ? 2.5 : 4.0) : (isGoalie ? 1.5 : 2.5);
        this.color = team === 'user' ? '#2563eb' : '#ea580c';
    }

    draw() {
        ctx.save();
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.x + (this.team === 'user' ? 4 : -4), this.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.isGoalie ? "G" : this.number.toString(), this.x, this.y);

        ctx.restore();
    }
}

// Teams Setup
const userTeam = [
    new Player(200, CH / 2, 'user', false, 10),
    new Player(150, CH / 2 - 120, 'user', false, 7),
    new Player(150, CH / 2 + 120, 'user', false, 22)
];
const userGoalie = new Player(GOAL_LEFT_X, CH / 2, 'user', true, 1);

const aiTeam = [
    new Player(CW - 200, CH / 2, 'ai', false, 12),
    new Player(CW - 150, CH / 2 - 120, 'ai', false, 8),
    new Player(CW - 150, CH / 2 + 120, 'ai', false, 44)
];
const aiGoalie = new Player(GOAL_RIGHT_X, CH / 2, 'ai', true, 30);

let activeUserIdx = 0;
let ballCarrier = userTeam[0];

const ball = {
    x: userTeam[0].x,
    y: userTeam[0].y,
    vx: 0,
    vy: 0,
    radius: 7,
    isLoose: false
};

// --- CONTROLS ---
window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;
});

window.addEventListener('keydown', (e) => {
    keyState[e.code] = true;

    if (e.code === 'KeyF' && ballCarrier === userTeam[activeUserIdx]) {
        shootBall(85);
    }

    if (e.code === 'Space') {
        // Instant Stick Check if close to AI ball carrier
        if (ballCarrier && ballCarrier.team === 'ai') {
            performCheck();
        }

        if (!meterCharging) {
            meterCharging = true;
            meterPower = 0;
            document.getElementById('meter-container').style.display = 'block';
        }
    }
});

window.addEventListener('keyup', (e) => {
    keyState[e.code] = false;

    if (e.code === 'Space' && meterCharging) {
        if (ballCarrier === userTeam[activeUserIdx]) {
            if (userTeam[activeUserIdx].x > CW / 2 - 50) {
                shootBall(meterPower);
            } else {
                passBall(meterPower);
            }
        }
        meterCharging = false;
        document.getElementById('meter-container').style.display = 'none';
    }
});

function triggerPopup(text) {
    const pop = document.getElementById('popup-effect');
    pop.innerText = text;
    pop.classList.add('active');
    setTimeout(() => pop.classList.remove('active'), 650);
}

function passBall(power) {
    let nearestTeammate = null;
    let minDist = 999;

    userTeam.forEach((p, idx) => {
        if (idx !== activeUserIdx) {
            const d = Math.hypot(p.x - mousePos.x, p.y - mousePos.y);
            if (d < minDist) { minDist = d; nearestTeammate = p; }
        }
    });

    const target = nearestTeammate ? nearestTeammate : mousePos;
    const angle = Math.atan2(target.y - ball.y, target.x - ball.x);
    const speed = 8 + (power / 100) * 8;

    ballCarrier = null;
    ball.isLoose = true;
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
}

function shootBall(power) {
    const angle = Math.atan2(mousePos.y - ball.y, GOAL_RIGHT_X - ball.x);
    const speed = 11 + (power / 100) * 9;

    ballCarrier = null;
    ball.isLoose = true;
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    triggerPopup("SHOT!");
}

function performCheck() {
    const userP = userTeam[activeUserIdx];
    if (ballCarrier && ballCarrier.team === 'ai') {
        const d = Math.hypot(userP.x - ballCarrier.x, userP.y - ballCarrier.y);
        // Extended check range to 65px with 100% success rate
        if (d < 65) {
            triggerPopup("STICK CHECK!");
            dislodgeBall(ballCarrier.x, ballCarrier.y);
        }
    }
}

function dislodgeBall(x, y) {
    ballCarrier = null;
    ball.isLoose = true;
    ball.x = x; ball.y = y;
    ball.vx = (Math.random() - 0.5) * 7;
    ball.vy = (Math.random() - 0.5) * 7;
    document.getElementById('status-bar').innerText = "LOOSE BALL! Run over it to scoop possession!";
}

function resetRound(scoringTeam) {
    ball.isLoose = false;
    ball.vx = 0; ball.vy = 0;

    userTeam[0].x = 200; userTeam[0].y = CH / 2;
    userTeam[1].x = 150; userTeam[1].y = CH / 2 - 120;
    userTeam[2].x = 150; userTeam[2].y = CH / 2 + 120;

    aiTeam[0].x = CW - 200; aiTeam[0].y = CH / 2;
    aiTeam[1].x = CW - 150; aiTeam[1].y = CH / 2 - 120;
    aiTeam[2].x = CW - 150; aiTeam[2].y = CH / 2 + 120;

    userGoalie.x = GOAL_LEFT_X; userGoalie.y = CH / 2;
    aiGoalie.x = GOAL_RIGHT_X; aiGoalie.y = CH / 2;

    if (scoringTeam === 'user') {
        ballCarrier = aiTeam[0];
        gameState = "DEFENSE";
    } else {
        ballCarrier = userTeam[0];
        activeUserIdx = 0;
        gameState = "OFFENSE";
    }
}

function resolveCollisions() {
    const all = [...userTeam, ...aiTeam, userGoalie, aiGoalie];
    for (let i = 0; i < all.length; i++) {
        for (let j = i + 1; j < all.length; j++) {
            const p1 = all[i], p2 = all[j];
            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            const dist = Math.hypot(dx, dy);
            const minDist = p1.radius + p2.radius + 2;

            if (dist < minDist && dist > 0) {
                const overlap = (minDist - dist) / 2;
                p1.x -= (dx / dist) * overlap;
                p1.y -= (dy / dist) * overlap;
                p2.x += (dx / dist) * overlap;
                p2.y += (dy / dist) * overlap;
            }
        }
    }
}

function updateAI() {
    // 1. Teammates Cutting Upfield
    userTeam.forEach((p, idx) => {
        if (idx !== activeUserIdx) {
            const targetX = CW / 2 + 80 + Math.sin(Date.now() * 0.002 + idx) * 60;
            const targetY = (idx === 1 ? 110 : CH - 110) + Math.cos(Date.now() * 0.002) * 40;
            p.x += (targetX - p.x) * 0.04;
            p.y += (targetY - p.y) * 0.04;
        }
    });

    // 2. AI Defenders (Nerfed Speed Multiplier: 0.60x)
    if (ballCarrier && ballCarrier.team === 'user') {
        let closestIdx = 0, minDist = 999;
        aiTeam.forEach((def, i) => {
            const d = Math.hypot(def.x - ballCarrier.x, def.y - ballCarrier.y);
            if (d < minDist) { minDist = d; closestIdx = i; }
        });

        aiTeam.forEach((def, i) => {
            if (i === closestIdx) {
                const angle = Math.atan2(ballCarrier.y - def.y, ballCarrier.x - def.x);
                def.x += Math.cos(angle) * (def.speed * 0.60);
                def.y += Math.sin(angle) * (def.speed * 0.60);

                if (minDist < 25 && Math.random() < 0.008) {
                    triggerPopup("AI CHECKED YOU!");
                    dislodgeBall(ballCarrier.x, ballCarrier.y);
                }
            } else {
                const teammate = userTeam[(i + activeUserIdx) % userTeam.length];
                const blockX = (teammate.x + GOAL_RIGHT_X) / 2;
                const blockY = teammate.y;
                def.x += (blockX - def.x) * 0.03;
                def.y += (blockY - def.y) * 0.03;
            }
        });

    } else if (ballCarrier && ballCarrier.team === 'ai') {
        const carrier = ballCarrier;
        const angle = Math.atan2(CH / 2 - carrier.y, GOAL_LEFT_X - carrier.x);
        carrier.x += Math.cos(angle) * carrier.speed * 0.6;
        carrier.y += Math.sin(angle) * carrier.speed * 0.6;

        if (carrier.x < CW / 2 - 50 && Math.random() < 0.012) {
            triggerPopup("AI SHOT!");
            ballCarrier = null;
            ball.isLoose = true;
            const shotAngle = Math.atan2((CH / 2 + (Math.random() - 0.5) * 60) - carrier.y, GOAL_LEFT_X - carrier.x);
            ball.vx = Math.cos(shotAngle) * 10;
            ball.vy = Math.sin(shotAngle) * 10;
        }
    } else if (ball.isLoose) {
        const def = aiTeam[0];
        const angle = Math.atan2(ball.y - def.y, ball.x - def.x);
        def.x += Math.cos(angle) * (def.speed * 0.7);
        def.y += Math.sin(angle) * (def.speed * 0.7);
    }

    // 3. AI Goalie Reaction Speed Nerfed (0.035 factor)
    if (ball.isLoose && ball.vx > 0) {
        aiGoalie.y += (ball.y - aiGoalie.y) * 0.035;
    } else {
        aiGoalie.y += (CH / 2 - aiGoalie.y) * 0.02;
    }
    aiGoalie.y = Math.max(CH / 2 - GOAL_HEIGHT / 2 + 10, Math.min(CH / 2 + GOAL_HEIGHT / 2 - 10, aiGoalie.y));

    // User Goalie
    if (ball.isLoose && ball.vx < 0) {
        userGoalie.y += (ball.y - userGoalie.y) * 0.12;
    } else {
        userGoalie.y += (CH / 2 - userGoalie.y) * 0.05;
    }
    userGoalie.y = Math.max(CH / 2 - GOAL_HEIGHT / 2 + 10, Math.min(CH / 2 + GOAL_HEIGHT / 2 - 10, userGoalie.y));
}

function drawField() {
    ctx.fillStyle = '#15803d';
    ctx.fillRect(0, 0, CW, CH);

    ctx.fillStyle = '#166534';
    for (let x = 0; x < CW; x += 80) {
        ctx.fillRect(x, 0, 40, CH);
    }

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.strokeRect(20, 20, CW - 40, CH - 40);

    ctx.beginPath();
    ctx.moveTo(CW / 2, 20); ctx.lineTo(CW / 2, CH - 20);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(CW / 2, CH / 2, 60, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#ef4444';
    ctx.fillRect(GOAL_LEFT_X - 10, CH / 2 - GOAL_HEIGHT / 2, 10, GOAL_HEIGHT);
    ctx.fillRect(GOAL_RIGHT_X, CH / 2 - GOAL_HEIGHT / 2, 10, GOAL_HEIGHT);
}

let lastTime = performance.now();

function gameLoop(time) {
    requestAnimationFrame(gameLoop);
    const delta = (time - lastTime) / 1000;
    lastTime = time;

    if (clockTime > 0) {
        clockTime -= delta;
        const mins = Math.floor(clockTime / 60).toString().padStart(2, '0');
        const secs = Math.floor(clockTime % 60).toString().padStart(2, '0');
        document.getElementById('game-clock').innerText = `${mins}:${secs}`;
    } else if (period < 3) {
        period++; clockTime = 120;
        document.getElementById('game-period').innerText = `${period} / 3`;
        resetRound('user');
    }

    // User Movement
    const userP = userTeam[activeUserIdx];
    if (keyState['KeyW']) userP.y -= userP.speed;
    if (keyState['KeyS']) userP.y += userP.speed;
    if (keyState['KeyA']) userP.x -= userP.speed;
    if (keyState['KeyD']) userP.x += userP.speed;

    userP.x = Math.max(35, Math.min(CW - 35, userP.x));
    userP.y = Math.max(35, Math.min(CH - 35, userP.y));

    updateAI();
    resolveCollisions();

    // Ball Mechanics
    if (ballCarrier) {
        ball.x = ballCarrier.x + (ballCarrier.team === 'user' ? 14 : -14);
        ball.y = ballCarrier.y - 6;
        ball.vx = 0; ball.vy = 0;
        ball.isLoose = false;
    } else if (ball.isLoose) {
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vx *= 0.96;
        ball.vy *= 0.96;

        // Pickup Checks
        userTeam.forEach((p, idx) => {
            if (Math.hypot(p.x - ball.x, p.y - ball.y) < p.radius + 12) {
                ballCarrier = p;
                activeUserIdx = idx;
                gameState = "OFFENSE";
                document.getElementById('status-bar').innerText = "SCOOPED! You have possession!";
            }
        });

        aiTeam.forEach((p) => {
            if (Math.hypot(p.x - ball.x, p.y - ball.y) < p.radius + 8) {
                ballCarrier = p;
                gameState = "DEFENSE";
                document.getElementById('status-bar').innerText = "AI SCOOPED THE BALL!";
            }
        });

        // Goalie Block Checks
        if (Math.hypot(aiGoalie.x - ball.x, aiGoalie.y - ball.y) < aiGoalie.radius + 6) {
            triggerPopup("GOALIE SAVE!");
            dislodgeBall(aiGoalie.x - 20, aiGoalie.y);
        }
        if (Math.hypot(userGoalie.x - ball.x, userGoalie.y - ball.y) < userGoalie.radius + 6) {
            triggerPopup("GOALIE SAVE!");
            dislodgeBall(userGoalie.x + 20, userGoalie.y);
        }

        // Score Checks
        if (ball.x >= GOAL_RIGHT_X && Math.abs(ball.y - CH / 2) < GOAL_HEIGHT / 2) {
            userScore++;
            document.getElementById('score-user').innerText = userScore;
            triggerPopup("GOAL!!!");
            resetRound('user');
        }
        if (ball.x <= GOAL_LEFT_X && Math.abs(ball.y - CH / 2) < GOAL_HEIGHT / 2) {
            aiScore++;
            document.getElementById('score-ai').innerText = aiScore;
            triggerPopup("AI SCORED!");
            resetRound('ai');
        }
    }

    if (meterCharging) {
        meterPower += meterDir * 3;
        if (meterPower >= 100 || meterPower <= 0) meterDir *= -1;
        document.getElementById('meter-bar').style.width = meterPower + '%';
    }

    // --- RENDER ---
    drawField();

    // Aim Crosshair
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mousePos.x, mousePos.y, 8, 0, Math.PI * 2);
    ctx.stroke();

    // Controlled Player Ring
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(userP.x, userP.y, userP.radius + 6, 0, Math.PI * 2);
    ctx.stroke();

    // Render Players
    userGoalie.draw();
    aiGoalie.draw();
    userTeam.forEach(p => p.draw());
    aiTeam.forEach(p => p.draw());

    // Ball & Carrier Indicator
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#facc15';
    ctx.fill();
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.stroke();

    if (ballCarrier) {
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText("BALL", ballCarrier.x - 12, ballCarrier.y - 22);
    }
}

gameLoop(performance.now());
</script>
</body>
</html>
