<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Lacrosse Showdown</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0f172a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; }
        
        /* HUD UI Header */
        #hud {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 25px; background: rgba(15, 23, 42, 0.92);
            padding: 10px 28px; border-radius: 14px; border: 2px solid #38bdf8;
            color: white; font-weight: bold; font-size: 1.1rem; box-shadow: 0 6px 25px rgba(0,0,0,0.6);
            z-index: 10; backdrop-filter: blur(6px);
        }
        .hud-item { display: flex; flex-direction: column; align-items: center; }
        .hud-label { font-size: 0.72rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        .hud-val { font-size: 1.3rem; color: #f8fafc; font-weight: 800; }
        
        /* Banner & Status Overlay */
        #status-banner {
            position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92); color: #e2e8f0; padding: 12px 24px;
            border-radius: 10px; font-size: 0.95rem; text-align: center; z-index: 10;
            border: 1px solid #334155; pointer-events: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-weight: 600;
        }

        /* Shot Timer Overlay */
        #shot-clock-ui {
            position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
            font-size: 2.2rem; font-weight: 900; color: #ef4444; text-shadow: 0 0 12px rgba(239,68,68,0.8);
            display: none; z-index: 20; background: rgba(15, 23, 42, 0.85); padding: 4px 18px;
            border-radius: 8px; border: 2px solid #ef4444;
        }

        /* Check Popup Effect */
        #check-effect {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            font-size: 2.8rem; font-weight: 900; color: #facc15; text-shadow: 0 0 20px #eab308;
            opacity: 0; pointer-events: none; z-index: 30; transition: transform 0.2s, opacity 0.2s;
            text-align: center;
        }
        #check-effect.active {
            transform: translate(-50%, -50%) scale(1.1); opacity: 1;
        }

        /* Shot / Pass Meter UI */
        #meter-container {
            position: absolute; bottom: 75px; left: 50%; transform: translateX(-50%);
            width: 280px; height: 24px; background: #0f172a; border: 2px solid #38bdf8;
            border-radius: 12px; overflow: hidden; display: none; z-index: 20;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        #meter-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6 0%, #22c55e 70%, #ef4444 100%); }
        #meter-target {
            position: absolute; left: 65%; width: 20%; height: 100%;
            background: rgba(34, 197, 94, 0.4); border-left: 2px solid #22c55e; border-right: 2px solid #22c55e;
        }

        /* First Person Goal Crosshair */
        #crosshair {
            position: absolute; width: 32px; height: 32px;
            border: 3px solid #ef4444; border-radius: 50%;
            display: none; pointer-events: none; z-index: 25;
            transform: translate(-50%, -50%); box-shadow: 0 0 12px #ef4444;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            background: #ef4444; border-radius: 50%; transform: translate(-50%, -50%);
        }
    </style>
    <!-- Three.js Engine CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <div class="hud-item"><span class="hud-label">Home</span><span id="score-user" class="hud-val">0</span></div>
        <div class="hud-item"><span class="hud-label">Period</span><span id="game-period" class="hud-val">1 / 3</span></div>
        <div class="hud-item"><span class="hud-label">Time</span><span id="game-clock" class="hud-val">02:00</span></div>
        <div class="hud-item"><span class="hud-label">Away</span><span id="score-ai" class="hud-val">0</span></div>
    </div>

    <div id="status-banner">
        WASD: Move | Mouse: Aim Target & Stick | Space: Pass/Check | F: Bullet-Time Shot Mode
    </div>

    <div id="shot-clock-ui">1.0s</div>
    <div id="check-effect">BALL DISLODGED!</div>

    <div id="meter-container">
        <div id="meter-target"></div>
        <div id="meter-bar"></div>
    </div>

    <div id="crosshair"></div>
    <div id="canvas-container"></div>

<script>
// --- CONSTANTS & CONFIG ---
const FIELD_W = 60, FIELD_L = 110, HALF_L = FIELD_L / 2;
const MIN_PLAYER_DIST = 1.6;
let period = 1, clockTime = 120, userScore = 0, aiScore = 0;
let gameState = "OFFENSE"; // OFFENSE, SHOT_MODE, DEFENSE
let meterPower = 0, meterCharging = false, meterDir = 1;
let shotClockTimer = 1.0;
let keyState = {}, mousePos = new THREE.Vector2(), groundTarget = new THREE.Vector3();
let rawMousePixel = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

// Three.js Core
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambLight = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.75);
dirLight.position.set(40, 80, 30);
scene.add(dirLight);

// Field Texture
function generateFieldTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 2048;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = "#15803d"; ctx.fillRect(0, 0, 1024, 2048);
    ctx.fillStyle = "#166534";
    for (let y = 0; y < 2048; y += 128) ctx.fillRect(0, y, 1024, 64);

    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 14;
    ctx.strokeRect(30, 30, 964, 1988);
    ctx.beginPath(); ctx.moveTo(30, 1024); ctx.lineTo(994, 1024); ctx.stroke();
    ctx.beginPath(); ctx.arc(512, 1024, 110, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(512, 220, 140, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(512, 1828, 140, 0, Math.PI * 2); ctx.stroke();

    return new THREE.CanvasTexture(canvas);
}

const field = new THREE.Mesh(
    new THREE.PlaneGeometry(FIELD_W, FIELD_L),
    new THREE.MeshLambertMaterial({ map: generateFieldTexture() })
);
field.rotation.x = -Math.PI / 2;
scene.add(field);

// Target Ring
const targetRing = new THREE.Mesh(
    new THREE.RingGeometry(0.8, 1.1, 32),
    new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide })
);
targetRing.rotation.x = -Math.PI / 2;
targetRing.position.y = 0.05;
scene.add(targetRing);

// Possession Indicator Marker
const possessionMarker = new THREE.Mesh(
    new THREE.ConeGeometry(0.4, 0.8, 16),
    new THREE.MeshBasicMaterial({ color: 0xfacc15 })
);
possessionMarker.rotation.x = Math.PI;
scene.add(possessionMarker);

// Loose Ground Ball Indicator
const groundBallRing = new THREE.Mesh(
    new THREE.RingGeometry(0.4, 0.7, 32),
    new THREE.MeshBasicMaterial({ color: 0xfacc15, side: THREE.DoubleSide })
);
groundBallRing.rotation.x = -Math.PI / 2;
groundBallRing.position.y = 0.06;
groundBallRing.visible = false;
scene.add(groundBallRing);

// Goals Construction
function buildGoal(zPos) {
    const goal = new THREE.Group();
    const frameMat = new THREE.MeshLambertMaterial({ color: 0xef4444 });
    const pGeo = new THREE.CylinderGeometry(0.12, 0.12, 3.2, 12);
    
    const lp = new THREE.Mesh(pGeo, frameMat); lp.position.set(-2, 1.6, 0);
    const rp = new THREE.Mesh(pGeo, frameMat); rp.position.set(2, 1.6, 0);
    const tb = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4.2, 12), frameMat);
    tb.rotation.z = Math.PI / 2; tb.position.set(0, 3.2, 0);

    goal.add(lp, rp, tb);
    goal.position.set(0, 0, zPos);
    return goal;
}
const userGoal = buildGoal(HALF_L - 6);
const aiGoal = buildGoal(-HALF_L + 6);
scene.add(userGoal, aiGoal);

// --- PLAYERS & GOALIES ---
function createPlayer(color) {
    const p = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: color });

    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.4, 1.4, 12), mat);
    body.position.y = 1.2;
    p.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), new THREE.MeshLambertMaterial({ color: 0x1e293b }));
    head.position.y = 2.1;
    p.add(head);

    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.2, 8), new THREE.MeshLambertMaterial({ color: 0xe2e8f0 }));
    stick.position.set(0.5, 1.3, -0.3);
    stick.rotation.x = Math.PI / 4;
    p.add(stick);
    p.stick = stick;

    return p;
}

const userTeam = [createPlayer(0x2563eb), createPlayer(0x2563eb), createPlayer(0x2563eb)];
const aiTeam = [createPlayer(0xd97706), createPlayer(0xd97706), createPlayer(0xd97706)];
const userGoalie = createPlayer(0x2563eb); // User Team Goalie
const aiGoalie = createPlayer(0xd97706);   // AI Team Goalie

userTeam.forEach((p, i) => { p.position.set((i - 1) * 10, 0, 15); scene.add(p); });
aiTeam.forEach((p, i) => { p.position.set((i - 1) * 10, 0, -15); scene.add(p); });

userGoalie.position.set(0, 0, HALF_L - 6);
aiGoalie.position.set(0, 0, -HALF_L + 6);
scene.add(userGoalie, aiGoalie);

let activeUserIdx = 0;
let ballCarrier = userTeam[0];
let isGroundBall = false;

const ball = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xfacc15 })
);
scene.add(ball);

let ballVel = new THREE.Vector3(), ballInAir = false;

// --- INPUTS & RAYCASTING ---
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

window.addEventListener('mousemove', (e) => {
    rawMousePixel.x = e.clientX;
    rawMousePixel.y = e.clientY;

    mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
    mousePos.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mousePos, camera);
    raycaster.ray.intersectPlane(groundPlane, groundTarget);
    targetRing.position.x = groundTarget.x;
    targetRing.position.z = groundTarget.z;

    if (gameState === "SHOT_MODE") {
        const crosshair = document.getElementById('crosshair');
        crosshair.style.left = rawMousePixel.x + 'px';
        crosshair.style.top = rawMousePixel.y + 'px';
    }
});

window.addEventListener('keydown', (e) => {
    keyState[e.code] = true;

    if (e.code === 'KeyF' && ballCarrier === userTeam[activeUserIdx]) {
        if (userTeam[activeUserIdx].position.z < 0) {
            if (gameState === "OFFENSE") {
                enterShotMode();
            } else if (gameState === "SHOT_MODE") {
                exitShotMode();
            }
        }
    }

    if (e.code === 'Space' && !meterCharging && !ballInAir) {
        meterCharging = true;
        meterPower = 0;
        document.getElementById('meter-container').style.display = 'block';

        if (gameState === "DEFENSE" || (ballCarrier && aiTeam.includes(ballCarrier))) {
            performUserCheck();
        }
    }
});

window.addEventListener('keyup', (e) => {
    keyState[e.code] = false;

    if (e.code === 'Space' && meterCharging) {
        if ((gameState === "OFFENSE" || gameState === "SHOT_MODE") && ballCarrier === userTeam[activeUserIdx]) {
            executePassOrShot();
        }
        meterCharging = false;
        document.getElementById('meter-container').style.display = 'none';
    }
});

function enterShotMode() {
    gameState = "SHOT_MODE";
    shotClockTimer = 1.0;
    document.getElementById('crosshair').style.display = 'block';
    document.getElementById('shot-clock-ui').style.display = 'block';
    document.getElementById('status-banner').innerText = "BULLET TIME: Aim with Mouse | Hold Space to Shoot (1s Timer!)";
}

function exitShotMode() {
    gameState = "OFFENSE";
    document.getElementById('crosshair').style.display = 'none';
    document.getElementById('shot-clock-ui').style.display = 'none';
    document.getElementById('status-banner').innerText = "WASD: Move | Mouse: Aim Target & Stick | Space: Charge Pass/Shot | F: Shot Mode";
}

function triggerVisualCheckEffect(text = "CHECKED!") {
    const el = document.getElementById('check-effect');
    el.innerText = text;
    el.classList.add('active');
    setTimeout(() => el.classList.remove('active'), 600);
}

function dislodgeBallToGround(pos) {
    ballCarrier = null;
    ballInAir = false;
    isGroundBall = true;
    ballVel.set((Math.random() - 0.5) * 0.1, 0, (Math.random() - 0.5) * 0.1);
    ball.position.set(pos.x + (Math.random() - 0.5), 0.25, pos.z + (Math.random() - 0.5));
    document.getElementById('status-banner').innerText = "LOOSE BALL! Run over the ball on the field to scoop it up!";
}

function performUserCheck() {
    const userPlayer = userTeam[activeUserIdx];
    if (userPlayer.stick) userPlayer.stick.rotation.y = Math.PI / 2;
    setTimeout(() => { if (userPlayer.stick) userPlayer.stick.rotation.y = 0; }, 250);

    if (ballCarrier && aiTeam.includes(ballCarrier)) {
        if (userPlayer.position.distanceTo(ballCarrier.position) < 2.0) {
            triggerVisualCheckEffect("GREAT CHECK!");
            dislodgeBallToGround(ballCarrier.position);
        }
    }
}

function executePassOrShot() {
    ballInAir = true;
    isGroundBall = false;
    const shooter = userTeam[activeUserIdx];

    if (gameState === "SHOT_MODE") {
        const targetX = mousePos.x * 3.0;
        const targetY = Math.max(0.4, Math.min(3.0, (mousePos.y + 0.5) * 2.5));
        const shotTarget = new THREE.Vector3(targetX, targetY, -HALF_L + 6);

        const dir = new THREE.Vector3().subVectors(shotTarget, shooter.position).normalize();
        const speed = 0.9 + (meterPower / 100) * 1.0;
        ballVel.copy(dir.multiplyScalar(speed));

        exitShotMode();

    } else if (gameState === "OFFENSE") {
        let nearestTeammate = null;
        let minDist = 14.0;

        userTeam.forEach((p, idx) => {
            if (idx !== activeUserIdx) {
                const d = p.position.distanceTo(groundTarget);
                if (d < minDist) { minDist = d; nearestTeammate = idx; }
            }
        });

        const passTarget = nearestTeammate !== null ? userTeam[nearestTeammate].position : groundTarget;
        const dir = new THREE.Vector3().subVectors(passTarget, shooter.position).normalize();

        const speed = 0.45 + (meterPower / 100) * 0.5;
        ballVel.copy(dir.multiplyScalar(speed));
        ballVel.y = meterPower < 20 ? 0.16 : 0.08;

        ballCarrier = null;
    }
}

function resetRound(carrier) {
    exitShotMode();
    ballCarrier = carrier;
    ballInAir = false;
    isGroundBall = false;
    ballVel.set(0, 0, 0);
    
    if (userTeam.includes(carrier)) {
        gameState = "OFFENSE";
        activeUserIdx = userTeam.indexOf(carrier);
    } else {
        gameState = "DEFENSE";
    }

    userTeam[0].position.set(0, 0, 15);
    userTeam[1].position.set(12, 0, 20);
    userTeam[2].position.set(-12, 0, 20);

    aiTeam[0].position.set(0, 0, -15);
    aiTeam[1].position.set(12, 0, -20);
    aiTeam[2].position.set(-12, 0, -20);

    userGoalie.position.set(0, 0, HALF_L - 6);
    aiGoalie.position.set(0, 0, -HALF_L + 6);
}

// Collisions
function enforcePlayerCollisions() {
    const allPlayers = [...userTeam, ...aiTeam, userGoalie, aiGoalie];
    for (let i = 0; i < allPlayers.length; i++) {
        for (let j = i + 1; j < allPlayers.length; j++) {
            const p1 = allPlayers[i];
            const p2 = allPlayers[j];
            const dist = p1.position.distanceTo(p2.position);

            if (dist < MIN_PLAYER_DIST && dist > 0.001) {
                const overlap = (MIN_PLAYER_DIST - dist) / 2;
                const pushDir = new THREE.Vector3().subVectors(p1.position, p2.position).normalize();
                pushDir.y = 0;
                p1.position.addScaledVector(pushDir, overlap);
                p2.position.subScaledVector(pushDir, -overlap);
            }
        }
    }
}

// AI Tactics
function updateAI(timeScale) {
    const ballPos = ballCarrier ? ballCarrier.position : ball.position;

    // 1. Off-ball User Teammates cutting to get open
    userTeam.forEach((p, idx) => {
        if (idx !== activeUserIdx) {
            const openTarget = new THREE.Vector3(
                (idx === 1 ? 14 : -14) + Math.sin(Date.now() * 0.0015 + idx) * 6,
                0,
                -12 + Math.cos(Date.now() * 0.0015) * 8
            );
            const dir = new THREE.Vector3().subVectors(openTarget, p.position).normalize();
            p.position.add(dir.multiplyScalar(0.12 * timeScale));
        }
    });

    // 2. AI Defenders Behavior (Strictly maintain defensive half unless on offense)
    if (gameState === "OFFENSE" || (ballCarrier && userTeam.includes(ballCarrier)) || (isGroundBall && ball.position.z < 0)) {
        let closestDefenderIdx = 0;
        let minDist = 999;
        aiTeam.forEach((defender, idx) => {
            const d = defender.position.distanceTo(ballPos);
            if (d < minDist) { minDist = d; closestDefenderIdx = idx; }
        });

        aiTeam.forEach((defender, idx) => {
            if (idx === closestDefenderIdx) {
                // Primary Pursuer - Attacks ball carrier or ground ball
                const targetPoint = isGroundBall ? ball.position : ballPos;
                const dir = new THREE.Vector3().subVectors(targetPoint, defender.position).normalize();
                
                // Keep defender on defensive half (z < 5 max)
                if (defender.position.z + dir.z * 0.16 <= 5) {
                    defender.position.add(dir.multiplyScalar(0.16 * timeScale));
                }

                // AI Check Attempt
                if (!isGroundBall && defender.position.distanceTo(userTeam[activeUserIdx].position) < 1.5 && ballCarrier === userTeam[activeUserIdx]) {
                    if (Math.random() < 0.02) {
                        triggerVisualCheckEffect("BALL CHECKED!");
                        dislodgeBallToGround(userTeam[activeUserIdx].position);
                    }
                }
            } else {
                // TACTICAL SHOT / PASS BLOCKING POSITIONING
                const assignedTeammate = userTeam[(idx + activeUserIdx) % userTeam.length];
                const blockPosition = new THREE.Vector3().addVectors(assignedTeammate.position, aiGoal.position).multiplyScalar(0.5);
                blockPosition.z = Math.min(-2, blockPosition.z);

                const dir = new THREE.Vector3().subVectors(blockPosition, defender.position).normalize();
                defender.position.add(dir.multiplyScalar(0.13 * timeScale));
            }
        });

    } else if (gameState === "DEFENSE" && ballCarrier && aiTeam.includes(ballCarrier)) {
        // 3. AI Offense Attack
        const aiCarrier = ballCarrier;
        const goalTarget = new THREE.Vector3(0, 0, HALF_L - 6);
        const dir = new THREE.Vector3().subVectors(goalTarget, aiCarrier.position).normalize();
        aiCarrier.position.add(dir.multiplyScalar(0.15 * timeScale));

        // AI Shoots on User Net
        if (aiCarrier.position.z > 10 && Math.random() < 0.012) {
            triggerVisualCheckEffect("AI SHOT!");
            ballInAir = true;
            ballCarrier = null;
            isGroundBall = false;
            const shotDir = new THREE.Vector3(
                (Math.random() - 0.5) * 3,
                1.5 + Math.random(),
                HALF_L - 6
            ).sub(aiCarrier.position).normalize();
            ballVel.copy(shotDir.multiplyScalar(0.85));
        }
    }

    // 4. AI Goalie (Defends AI Net)
    if (ballInAir && ballVel.z < 0) {
        const goalZ = -HALF_L + 6;
        const t = (goalZ - ball.position.z) / ballVel.z;
        const predictedX = ball.position.x + ballVel.x * t;
        const targetX = Math.max(-2.2, Math.min(2.2, predictedX));
        aiGoalie.position.x += (targetX - aiGoalie.position.x) * (0.25 * timeScale);
    } else {
        const idleX = Math.max(-1.8, Math.min(1.8, ballPos.x * 0.3));
        aiGoalie.position.x += (idleX - aiGoalie.position.x) * (0.08 * timeScale);
    }

    // 5. User Goalie (Defends User Net)
    if (ballInAir && ballVel.z > 0) {
        const goalZ = HALF_L - 6;
        const t = (goalZ - ball.position.z) / ballVel.z;
        const predictedX = ball.position.x + ballVel.x * t;
        const targetX = Math.max(-2.2, Math.min(2.2, predictedX));
        userGoalie.position.x += (targetX - userGoalie.position.x) * (0.25 * timeScale);
    } else {
        const idleX = Math.max(-1.8, Math.min(1.8, ballPos.x * 0.3));
        userGoalie.position.x += (idleX - userGoalie.position.x) * (0.08 * timeScale);
    }
}

// --- MAIN GAME LOOP ---
let lastTime = performance.now();

function animate(time) {
    requestAnimationFrame(animate);
    const delta = (time - lastTime) / 1000;
    lastTime = time;

    const timeScale = gameState === "SHOT_MODE" ? 0.05 : 1.0;

    // Clock Engine
    if (clockTime > 0) {
        clockTime -= delta * timeScale;
        const mins = Math.floor(clockTime / 60).toString().padStart(2, '0');
        const secs = Math.floor(clockTime % 60).toString().padStart(2, '0');
        document.getElementById('game-clock').innerText = `${mins}:${secs}`;
    } else if (period < 3) {
        period++; clockTime = 120;
        document.getElementById('game-period').innerText = `${period} / 3`;
        resetRound(userTeam[0]);
    }

    // Shot Clock (1.0s limit in Shot Mode)
    if (gameState === "SHOT_MODE") {
        shotClockTimer -= delta;
        document.getElementById('shot-clock-ui').innerText = Math.max(0, shotClockTimer).toFixed(1) + 's';

        if (shotClockTimer <= 0) {
            triggerVisualCheckEffect("AUTO-CHECKED!");
            exitShotMode();
            dislodgeBallToGround(userTeam[activeUserIdx].position);
        }
    }

    // User Movement (WASD)
    const player = userTeam[activeUserIdx];
    if (gameState !== "SHOT_MODE") {
        const moveSpeed = 0.22;
        if (keyState['KeyW']) player.position.z -= moveSpeed;
        if (keyState['KeyS']) player.position.z += moveSpeed;
        if (keyState['KeyA']) player.position.x -= moveSpeed;
        if (keyState['KeyD']) player.position.x += moveSpeed;

        if (player.stick) {
            const sideTilt = (groundTarget.x - player.position.x) * 0.06;
            player.stick.rotation.z = Math.max(-0.9, Math.min(0.9, sideTilt));
        }
    }

    updateAI(timeScale);
    enforcePlayerCollisions();

    // Ground Ball Ring & Scooping Mechanic
    if (isGroundBall) {
        groundBallRing.visible = true;
        groundBallRing.position.set(ball.position.x, 0.06, ball.position.z);

        // User Scoop Check
        userTeam.forEach((p, idx) => {
            if (p.position.distanceTo(ball.position) < 1.8) {
                ballCarrier = p;
                activeUserIdx = idx;
                isGroundBall = false;
                gameState = "OFFENSE";
                document.getElementById('status-banner').innerText = "BALL SCOOPED UP! You have possession!";
            }
        });

        // AI Scoop Check
        aiTeam.forEach((p) => {
            if (p.position.distanceTo(ball.position) < 1.8) {
                ballCarrier = p;
                isGroundBall = false;
                gameState = "DEFENSE";
                document.getElementById('status-banner').innerText = "AI SCOOPED UP THE BALL!";
            }
        });
    } else {
        groundBallRing.visible = false;
    }

    // Bouncing Possession Marker
    if (ballCarrier) {
        possessionMarker.visible = true;
        possessionMarker.position.set(
            ballCarrier.position.x,
            3.2 + Math.sin(Date.now() * 0.008) * 0.25,
            ballCarrier.position.z
        );
    } else {
        possessionMarker.visible = false;
    }

    // Ball Mechanics & Catching
    if (!ballInAir && ballCarrier) {
        ball.position.copy(ballCarrier.position).add(new THREE.Vector3(0.3, 1.2, -0.3));
    } else if (ballInAir) {
        ball.position.add(ballVel.clone().multiplyScalar(timeScale));
        ballVel.y -= 0.008 * timeScale;

        // User Catching Pass
        userTeam.forEach((p, idx) => {
            if (p.position.distanceTo(ball.position) < 1.6 && ballVel.y < 0.1) {
                ballCarrier = p;
                activeUserIdx = idx;
                ballInAir = false;
                isGroundBall = false;
                gameState = "OFFENSE";
            }
        });

        // AI Catching Pass
        aiTeam.forEach((p) => {
            if (p.position.distanceTo(ball.position) < 1.6 && ballVel.y < 0.1) {
                ballCarrier = p;
                ballInAir = false;
                isGroundBall = false;
                gameState = "DEFENSE";
            }
        });

        // AI Goalie Save Check
        if (ball.position.distanceTo(aiGoalie.position) < 1.5) {
            triggerVisualCheckEffect("GOALIE SAVE!");
            ballInAir = false;
            dislodgeBallToGround(aiGoalie.position);
        }

        // User Goalie Save Check
        if (ball.position.distanceTo(userGoalie.position) < 1.5) {
            triggerVisualCheckEffect("GOALIE SAVE!");
            ballInAir = false;
            dislodgeBallToGround(userGoalie.position);
        }

        // User Score Check (AI Goal)
        if (ball.position.z <= aiGoal.position.z + 0.8 && Math.abs(ball.position.x) < 2.2 && ball.position.y < 3.2 && ball.position.y > 0) {
            userScore++;
            document.getElementById('score-user').innerText = userScore;
            triggerVisualCheckEffect("GOAL!!!");
            resetRound(userTeam[0]);
        }

        // AI Score Check (User Goal)
        if (ball.position.z >= userGoal.position.z - 0.8 && Math.abs(ball.position.x) < 2.2 && ball.position.y < 3.2 && ball.position.y > 0) {
            aiScore++;
            document.getElementById('score-ai').innerText = aiScore;
            triggerVisualCheckEffect("AI SCORED!");
            resetRound(userTeam[0]);
        }
    }

    // Shot / Pass Meter Cycle
    if (meterCharging) {
        meterPower += meterDir * 2.8;
        if (meterPower >= 100 || meterPower <= 0) meterDir *= -1;
        document.getElementById('meter-bar').style.width = meterPower + '%';
    }

    // Camera Modes
    if (gameState === "SHOT_MODE") {
        camera.position.copy(player.position).add(new THREE.Vector3(0, 1.7, 0));
        camera.lookAt(0, 1.6, -HALF_L + 6);
    } else {
        const camOffset = new THREE.Vector3(0, 13, 17);
        camera.position.copy(player.position).add(camOffset);
        camera.lookAt(player.position.x, 1, player.position.z - 5);
    }

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate(performance.now());
</script>
</body>
</html>
