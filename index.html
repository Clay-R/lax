<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Lax Arcade 2D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #090d16;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Retro HUD Header */
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 800px;
            background: #111827;
            border: 3px solid #38bdf8;
            border-bottom: none;
            padding: 10px 25px;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 -4px 20px rgba(56, 189, 248, 0.2);
        }
        .score-box { text-align: center; }
        .score-label { font-size: 0.8rem; color: #38bdf8; text-transform: uppercase; font-weight: bold; }
        .score-val { font-size: 1.8rem; font-weight: 900; color: #f8fafc; }

        /* Game Canvas */
        #gameCanvas {
            background: #15803d;
            border: 3px solid #38bdf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            cursor: crosshair;
        }

        /* Retro Status Bar */
        #status-bar {
            width: 800px;
            background: #111827;
            border: 3px solid #38bdf8;
            border-top: none;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #f1f5f9;
            border-radius: 0 0 12px 12px;
            font-weight: bold;
        }

        /* Charge Meter Overlay */
        #meter-container {
            position: absolute;
            bottom: 60px;
            width: 260px;
            height: 18px;
            background: #0f172a;
            border: 2px solid #ffffff;
            border-radius: 9px;
            overflow: hidden;
            display: none;
            box-shadow: 0 0 10px #38bdf8;
        }
        #meter-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #22c55e, #ef4444); }

        /* Retro Banner Popups */
        #popup-effect {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-size: 2.8rem;
            font-weight: 900;
            color: #facc15;
            text-shadow: 3px 3px 0px #000, 0 0 15px #facc15;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease-out;
            text-align: center;
            z-index: 50;
        }
        #popup-effect.active {
            transform: translate(-50%, -50%) scale(1.1);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="score-box"><div class="score-label">HOME (YOU)</div><div id="score-user" class="score-val">0</div></div>
        <div class="score-box"><div class="score-label">PERIOD</div><div id="game-period" class="score-val">1 / 3</div></div>
        <div class="score-box"><div class="score-label">CLOCK</div><div id="game-clock" class="score-val">02:00</div></div>
        <div class="score-box"><div class="score-label">AWAY (AI)</div><div id="score-ai" class="score-val">0</div></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="status-bar">
        WASD: Move | Mouse: Aim Crosshair | Space: Hold to Pass / Check | F: Shoot on Goal
    </div>

    <div id="meter-container"><div id="meter-bar"></div></div>
    <div id="popup-effect">GOAL!</div>

<script>
// --- CANVAS & GAME ENGINE SETUP ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const CW = canvas.width;  // 800
const CH = canvas.height; // 600

// Field Markings Constants
const GOAL_TOP_Y = 60;
const GOAL_BOT_Y = CH - 60;
const GOAL_WIDTH = 70;
const CREASE_RADIUS = 50;

let period = 1, clockTime = 120, userScore = 0, aiScore = 0;
let gameState = "OFFENSE"; // OFFENSE, DEFENSE
let meterPower = 0, meterCharging = false, meterDir = 1;
let keyState = {}, mousePos = { x: CW / 2, y: CH / 2 };

// --- ENTITIES ---
class Player {
    constructor(x, y, team, isGoalie = false, id = 0) {
        this.x = x;
        this.y = y;
        this.team = team; // 'user' or 'ai'
        this.isGoalie = isGoalie;
        this.id = id;
        this.radius = 14;
        this.speed = isGoalie ? 2.5 : 3.6;
        this.color = team === 'user' ? '#2563eb' : '#d97706';
    }

    draw() {
        ctx.save();
        
        // Body Circle
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // Helmet/Visor Direction
        ctx.beginPath();
        ctx.arc(this.x, this.y - 2, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();

        // Goalie distinction banner
        if (this.isGoalie) {
            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 10px sans-serif';
            ctx.fillText("G", this.x - 3, this.y + 4);
        }

        ctx.restore();
    }
}

// Teams Setup
const userTeam = [
    new Player(CW / 2, CH - 150, 'user', false, 0),
    new Player(CW / 2 - 140, CH - 220, 'user', false, 1),
    new Player(CW / 2 + 140, CH - 220, 'user', false, 2)
];
const userGoalie = new Player(CW / 2, GOAL_BOT_Y, 'user', true, 3);

const aiTeam = [
    new Player(CW / 2, 180, 'ai', false, 0),
    new Player(CW / 2 - 140, 220, 'ai', false, 1),
    new Player(CW / 2 + 140, 220, 'ai', false, 2)
];
const aiGoalie = new Player(CW / 2, GOAL_TOP_Y, 'ai', true, 3);

let activeUserIdx = 0;
let ballCarrier = userTeam[0];

// Ball Object
const ball = {
    x: userTeam[0].x,
    y: userTeam[0].y,
    vx: 0,
    vy: 0,
    radius: 6,
    isLoose: false,
    color: '#facc15'
};

// --- INPUT LISTENERS ---
window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;
});

window.addEventListener('keydown', (e) => {
    keyState[e.code] = true;

    // Direct Quick Shot with F Key when on offense
    if (e.code === 'KeyF' && ballCarrier === userTeam[activeUserIdx]) {
        shootBall(85);
    }

    if (e.code === 'Space' && !meterCharging) {
        meterCharging = true;
        meterPower = 0;
        document.getElementById('meter-container').style.display = 'block';

        // Check attempt if on Defense
        if (gameState === "DEFENSE" || (ballCarrier && ballCarrier.team === 'ai')) {
            performCheck();
        }
    }
});

window.addEventListener('keyup', (e) => {
    keyState[e.code] = false;

    if (e.code === 'Space' && meterCharging) {
        if (ballCarrier === userTeam[activeUserIdx]) {
            if (userTeam[activeUserIdx].y < CH / 2) {
                shootBall(meterPower); // Shoot if on attacking half
            } else {
                passBall(meterPower); // Pass if on defensive half
            }
        }
        meterCharging = false;
        document.getElementById('meter-container').style.display = 'none';
    }
});

// --- GAME ACTIONS & POPUPS ---
function triggerPopup(text) {
    const pop = document.getElementById('popup-effect');
    pop.innerText = text;
    pop.classList.add('active');
    setTimeout(() => pop.classList.remove('active'), 650);
}

function passBall(power) {
    let nearestTeammate = null;
    let minDist = 999;

    userTeam.forEach((p, idx) => {
        if (idx !== activeUserIdx) {
            const d = Math.hypot(p.x - mousePos.x, p.y - mousePos.y);
            if (d < minDist) { minDist = d; nearestTeammate = p; }
        }
    });

    const target = nearestTeammate ? nearestTeammate : mousePos;
    const angle = Math.atan2(target.y - ball.y, target.x - ball.x);
    const speed = 7 + (power / 100) * 7;

    ballCarrier = null;
    ball.isLoose = true;
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
}

function shootBall(power) {
    const goalTargetX = Math.max(CW / 2 - GOAL_WIDTH / 2 + 5, Math.min(CW / 2 + GOAL_WIDTH / 2 - 5, mousePos.x));
    const angle = Math.atan2(GOAL_TOP_Y - ball.y, goalTargetX - ball.x);
    const speed = 10 + (power / 100) * 8;

    ballCarrier = null;
    ball.isLoose = true;
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    triggerPopup("SHOT!");
}

function performCheck() {
    const userP = userTeam[activeUserIdx];
    if (ballCarrier && ballCarrier.team === 'ai') {
        const d = Math.hypot(userP.x - ballCarrier.x, userP.y - ballCarrier.y);
        if (d < 38) {
            triggerPopup("GREAT CHECK!");
            dislodgeBall(ballCarrier.x, ballCarrier.y);
        }
    }
}

function dislodgeBall(x, y) {
    ballCarrier = null;
    ball.isLoose = true;
    ball.x = x;
    ball.y = y;
    ball.vx = (Math.random() - 0.5) * 6;
    ball.vy = (Math.random() - 0.5) * 6;
    document.getElementById('status-bar').innerText = "LOOSE BALL! Run over the ball to scoop possession!";
}

function resetRound(scoringTeam) {
    ball.isLoose = false;
    ball.vx = 0; ball.vy = 0;

    userTeam[0].x = CW / 2; userTeam[0].y = CH - 160;
    userTeam[1].x = CW / 2 - 140; userTeam[1].y = CH - 220;
    userTeam[2].x = CW / 2 + 140; userTeam[2].y = CH - 220;

    aiTeam[0].x = CW / 2; aiTeam[0].y = 180;
    aiTeam[1].x = CW / 2 - 140; aiTeam[1].y = 220;
    aiTeam[2].x = CW / 2 + 140; aiTeam[2].y = 220;

    userGoalie.x = CW / 2; userGoalie.y = GOAL_BOT_Y;
    aiGoalie.x = CW / 2; aiGoalie.y = GOAL_TOP_Y;

    if (scoringTeam === 'user') {
        ballCarrier = aiTeam[0];
        gameState = "DEFENSE";
    } else {
        ballCarrier = userTeam[0];
        activeUserIdx = 0;
        gameState = "OFFENSE";
    }
}

// --- COLLISION RESOLUTION ---
function resolveCollisions() {
    const all = [...userTeam, ...aiTeam, userGoalie, aiGoalie];
    for (let i = 0; i < all.length; i++) {
        for (let j = i + 1; j < all.length; j++) {
            const p1 = all[i];
            const p2 = all[j];
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dist = Math.hypot(dx, dy);
            const minDist = p1.radius + p2.radius + 2;

            if (dist < minDist && dist > 0) {
                const overlap = (minDist - dist) / 2;
                const nx = dx / dist;
                const ny = dy / dist;

                p1.x -= nx * overlap;
                p1.y -= ny * overlap;
                p2.x += nx * overlap;
                p2.y += ny * overlap;
            }
        }
    }
}

// --- AI TACTICS & UPDATES ---
function updateAI() {
    const activeUser = userTeam[activeUserIdx];

    // 1. Off-ball User Teammates Break Open into Passing Lanes
    userTeam.forEach((p, idx) => {
        if (idx !== activeUserIdx) {
            const targetX = (idx === 1 ? CW / 2 - 160 : CW / 2 + 160) + Math.sin(Date.now() * 0.002 + idx) * 40;
            const targetY = 200 + Math.cos(Date.now() * 0.002) * 50;
            p.x += (targetX - p.x) * 0.04;
            p.y += (targetY - p.y) * 0.04;
        }
    });

    // 2. AI Defenders
    if (ballCarrier && ballCarrier.team === 'user') {
        // Find closest AI defender
        let closestIdx = 0, minDist = 999;
        aiTeam.forEach((def, i) => {
            const d = Math.hypot(def.x - ballCarrier.x, def.y - ballCarrier.y);
            if (d < minDist) { minDist = d; closestIdx = i; }
        });

        aiTeam.forEach((def, i) => {
            if (i === closestIdx) {
                // Chase Ball Carrier
                const angle = Math.atan2(ballCarrier.y - def.y, ballCarrier.x - def.x);
                def.x += Math.cos(angle) * (def.speed * 0.85);
                def.y += Math.sin(angle) * (def.speed * 0.85);

                // Check Attempt
                if (minDist < 30 && Math.random() < 0.02) {
                    triggerPopup("AI CHECKED YOU!");
                    dislodgeBall(ballCarrier.x, ballCarrier.y);
                }
            } else {
                // Guard Passing Lanes between Teammates and Goal
                const teammate = userTeam[(i + activeUserIdx) % userTeam.length];
                const laneX = (teammate.x + CW / 2) / 2;
                const laneY = (teammate.y + GOAL_TOP_Y) / 2;
                def.x += (laneX - def.x) * 0.05;
                def.y += (laneY - def.y) * 0.05;
            }
        });

    } else if (ballCarrier && ballCarrier.team === 'ai') {
        // AI Attack on User Net
        const carrier = ballCarrier;
        const angle = Math.atan2(GOAL_BOT_Y - carrier.y, CW / 2 - carrier.x);
        carrier.x += Math.cos(angle) * carrier.speed * 0.7;
        carrier.y += Math.sin(angle) * carrier.speed * 0.7;

        // AI Shoots
        if (carrier.y > CH / 2 + 50 && Math.random() < 0.015) {
            triggerPopup("AI SHOT!");
            ballCarrier = null;
            ball.isLoose = true;
            const shotAngle = Math.atan2(GOAL_BOT_Y - carrier.y, (CW / 2 + (Math.random() - 0.5) * 50) - carrier.x);
            ball.vx = Math.cos(shotAngle) * 11;
            ball.vy = Math.sin(shotAngle) * 11;
        }
    } else if (ball.isLoose) {
        // AI Defender chases loose ground ball
        const def = aiTeam[0];
        const angle = Math.atan2(ball.y - def.y, ball.x - def.x);
        def.x += Math.cos(angle) * def.speed;
        def.y += Math.sin(angle) * def.speed;
    }

    // 3. Goalies Crease Positioning
    // AI Goalie
    if (ball.isLoose && ball.vy < 0) {
        aiGoalie.x += (ball.x - aiGoalie.x) * 0.15;
    } else {
        aiGoalie.x += (CW / 2 + Math.sin(Date.now() * 0.003) * 25 - aiGoalie.x) * 0.08;
    }
    aiGoalie.x = Math.max(CW / 2 - GOAL_WIDTH / 2, Math.min(CW / 2 + GOAL_WIDTH / 2, aiGoalie.x));

    // User Goalie
    if (ball.isLoose && ball.vy > 0) {
        userGoalie.x += (ball.x - userGoalie.x) * 0.15;
    } else {
        userGoalie.x += (CW / 2 + Math.sin(Date.now() * 0.003) * 25 - userGoalie.x) * 0.08;
    }
    userGoalie.x = Math.max(CW / 2 - GOAL_WIDTH / 2, Math.min(CW / 2 + GOAL_WIDTH / 2, userGoalie.x));
}

// --- DRAWING THE FIELD ---
function drawField() {
    // Pitch Turf
    ctx.fillStyle = '#15803d';
    ctx.fillRect(0, 0, CW, CH);

    // Mown Turf Stripes
    ctx.fillStyle = '#166534';
    for (let y = 0; y < CH; y += 60) {
        ctx.fillRect(0, y, CW, 30);
    }

    // Boundaries & Midfield Line
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.strokeRect(20, 20, CW - 40, CH - 40);

    ctx.beginPath();
    ctx.moveTo(20, CH / 2); ctx.lineTo(CW - 20, CH / 2);
    ctx.stroke();

    // Center Circle
    ctx.beginPath();
    ctx.arc(CW / 2, CH / 2, 60, 0, Math.PI * 2);
    ctx.stroke();

    // Crease Circles
    ctx.beginPath(); ctx.arc(CW / 2, GOAL_TOP_Y, CREASE_RADIUS, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(CW / 2, GOAL_BOT_Y, CREASE_RADIUS, 0, Math.PI * 2); ctx.stroke();

    // Goals Frames
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(CW / 2 - GOAL_WIDTH / 2, GOAL_TOP_Y - 10, GOAL_WIDTH, 10);
    ctx.fillRect(CW / 2 - GOAL_WIDTH / 2, GOAL_BOT_Y, GOAL_WIDTH, 10);
}

// --- MAIN LOOP ---
let lastTime = performance.now();

function gameLoop(time) {
    requestAnimationFrame(gameLoop);
    const delta = (time - lastTime) / 1000;
    lastTime = time;

    // Game Clock
    if (clockTime > 0) {
        clockTime -= delta;
        const mins = Math.floor(clockTime / 60).toString().padStart(2, '0');
        const secs = Math.floor(clockTime % 60).toString().padStart(2, '0');
        document.getElementById('game-clock').innerText = `${mins}:${secs}`;
    } else if (period < 3) {
        period++; clockTime = 120;
        document.getElementById('game-period').innerText = `${period} / 3`;
        resetRound('user');
    }

    // User Player Movement (WASD)
    const userP = userTeam[activeUserIdx];
    if (keyState['KeyW']) userP.y -= userP.speed;
    if (keyState['KeyS']) userP.y += userP.speed;
    if (keyState['KeyA']) userP.x -= userP.speed;
    if (keyState['KeyD']) userP.x += userP.speed;

    // Bounds Constraint
    userP.x = Math.max(35, Math.min(CW - 35, userP.x));
    userP.y = Math.max(35, Math.min(CH - 35, userP.y));

    // Update AI & Collision Step
    updateAI();
    resolveCollisions();

    // Ball Mechanics & Pickups
    if (ballCarrier) {
        ball.x = ballCarrier.x + 12;
        ball.y = ballCarrier.y - 8;
        ball.vx = 0; ball.vy = 0;
        ball.isLoose = false;
    } else if (ball.isLoose) {
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vx *= 0.96; // Friction
        ball.vy *= 0.96;

        // User Catch / Pickup
        userTeam.forEach((p, idx) => {
            if (Math.hypot(p.x - ball.x, p.y - ball.y) < p.radius + 10) {
                ballCarrier = p;
                activeUserIdx = idx; // Switch control to player who caught ball!
                gameState = "OFFENSE";
                document.getElementById('status-bar').innerText = "BALL SCOOPED! You have possession!";
            }
        });

        // AI Catch / Pickup
        aiTeam.forEach((p) => {
            if (Math.hypot(p.x - ball.x, p.y - ball.y) < p.radius + 10) {
                ballCarrier = p;
                gameState = "DEFENSE";
                document.getElementById('status-bar').innerText = "AI SCOOPED THE BALL! Press Space near them to check!";
            }
        });

        // Goalie Save Checks
        if (Math.hypot(aiGoalie.x - ball.x, aiGoalie.y - ball.y) < aiGoalie.radius + 10) {
            triggerPopup("GOALIE SAVE!");
            dislodgeBall(aiGoalie.x, aiGoalie.y + 20);
        }
        if (Math.hypot(userGoalie.x - ball.x, userGoalie.y - ball.y) < userGoalie.radius + 10) {
            triggerPopup("GOALIE SAVE!");
            dislodgeBall(userGoalie.x, userGoalie.y - 20);
        }

        // Scoring Checks
        // Top Net (User Goal)
        if (ball.y <= GOAL_TOP_Y && Math.abs(ball.x - CW / 2) < GOAL_WIDTH / 2) {
            userScore++;
            document.getElementById('score-user').innerText = userScore;
            triggerPopup("GOAL!!!");
            resetRound('user');
        }
        // Bottom Net (AI Goal)
        if (ball.y >= GOAL_BOT_Y && Math.abs(ball.x - CW / 2) < GOAL_WIDTH / 2) {
            aiScore++;
            document.getElementById('score-ai').innerText = aiScore;
            triggerPopup("AI SCORED!");
            resetRound('ai');
        }
    }

    // Pass / Shot Meter Charging
    if (meterCharging) {
        meterPower += meterDir * 3;
        if (meterPower >= 100 || meterPower <= 0) meterDir *= -1;
        document.getElementById('meter-bar').style.width = meterPower + '%';
    }

    // --- RENDER STEP ---
    drawField();

    // Draw Aim Reticle
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mousePos.x, mousePos.y, 10, 0, Math.PI * 2);
    ctx.stroke();

    // Draw Active Controlled Player Ring
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(userP.x, userP.y, userP.radius + 6, 0, Math.PI * 2);
    ctx.stroke();

    // Draw All Players
    userGoalie.draw();
    aiGoalie.draw();
    userTeam.forEach(p => p.draw());
    aiTeam.forEach(p => p.draw());

    // Draw Ball & Carrier Marker
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = ball.color;
    ctx.fill();
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    if (ballCarrier) {
        // Pulsing Marker Above Ball Carrier
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.moveTo(ballCarrier.x, ballCarrier.y - 24);
        ctx.lineTo(ballCarrier.x - 7, ballCarrier.y - 34);
        ctx.lineTo(ballCarrier.x + 7, ballCarrier.y - 34);
        ctx.closePath();
        ctx.fill();
    }
}

// Start Game Loop
gameLoop(performance.now());
</script>
</body>
</html>
