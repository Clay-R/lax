<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Lacrosse Showdown</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0f172a; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; }
        
        /* HUD UI Header */
        #hud {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 25px; background: rgba(15, 23, 42, 0.92);
            padding: 10px 28px; border-radius: 14px; border: 2px solid #38bdf8;
            color: white; font-weight: bold; font-size: 1.1rem; box-shadow: 0 6px 25px rgba(0,0,0,0.6);
            z-index: 10; backdrop-filter: blur(6px);
        }
        .hud-item { display: flex; flex-direction: column; align-items: center; }
        .hud-label { font-size: 0.72rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        .hud-val { font-size: 1.3rem; color: #f8fafc; font-weight: 800; }
        
        /* Banner & Status Overlay */
        #status-banner {
            position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); color: #e2e8f0; padding: 10px 22px;
            border-radius: 10px; font-size: 0.9rem; text-align: center; z-index: 10;
            border: 1px solid #334155; pointer-events: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Shot / Pass Meter UI */
        #meter-container {
            position: absolute; bottom: 75px; left: 50%; transform: translateX(-50%);
            width: 260px; height: 22px; background: #1e293b; border: 2px solid #ffffff;
            border-radius: 11px; overflow: hidden; display: none; z-index: 20;
        }
        #meter-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6 0%, #22c55e 65%, #ef4444 100%); }
        #meter-target {
            position: absolute; left: 60%; width: 20%; height: 100%;
            background: rgba(34, 197, 94, 0.45); border-left: 2px solid #22c55e; border-right: 2px solid #22c55e;
        }

        /* Goalie / Shot Reticle */
        #reticle {
            position: absolute; top: 50%; left: 50%; width: 32px; height: 32px;
            transform: translate(-50%, -50%); border: 3px solid #38bdf8; border-radius: 50%;
            display: none; pointer-events: none; z-index: 25; box-shadow: 0 0 12px #38bdf8;
        }
        #reticle::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            background: #22c55e; border-radius: 50%; transform: translate(-50%, -50%);
        }
    </style>
    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <div class="hud-item"><span class="hud-label">Home</span><span id="score-user" class="hud-val">0</span></div>
        <div class="hud-item"><span class="hud-label">Period</span><span id="game-period" class="hud-val">1 / 3</span></div>
        <div class="hud-item"><span class="hud-label">Time</span><span id="game-clock" class="hud-val">02:00</span></div>
        <div class="hud-item"><span class="hud-label">Away</span><span id="score-ai" class="hud-val">0</span></div>
    </div>

    <div id="status-banner">
        WASD: Move | Mouse: Target Ring & Stick Protection | Space: Pass/Check | F: 1st Person Shot (Enemy Half)
    </div>

    <div id="meter-container">
        <div id="meter-target"></div>
        <div id="meter-bar"></div>
    </div>

    <div id="reticle"></div>
    <div id="canvas-container"></div>

<script>
// --- ENGINE & GAME CONSTANTS ---
const FIELD_W = 60, FIELD_L = 110, HALF_L = FIELD_L / 2;
let period = 1, clockTime = 120, userScore = 0, aiScore = 0;
let gameState = "OFFENSE"; // OFFENSE, SHOT_MODE, DEFENSE, GOALIE_SAVE
let meterPower = 0, meterCharging = false, meterDir = 1, spacePressTime = 0;
let keyState = {}, mousePos = new THREE.Vector2(), groundTarget = new THREE.Vector3();

// Scene Setup
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambLight = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.75);
dirLight.position.set(40, 80, 30);
scene.add(dirLight);

// --- FIELD & GRAPHICS ---
function generateFieldTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 2048;
    const ctx = canvas.getContext('2d');

    // Turf Base
    ctx.fillStyle = "#15803d";
    ctx.fillRect(0, 0, 1024, 2048);

    // Mow Stripes
    ctx.fillStyle = "#166534";
    for (let y = 0; y < 2048; y += 128) {
        ctx.fillRect(0, y, 1024, 64);
    }

    // Boundary & Lines
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 14;
    ctx.strokeRect(30, 30, 964, 1988);

    // Midfield & Center Circle
    ctx.beginPath(); ctx.moveTo(30, 1024); ctx.lineTo(994, 1024); ctx.stroke();
    ctx.beginPath(); ctx.arc(512, 1024, 110, 0, Math.PI * 2); ctx.stroke();

    // Goal Creases
    ctx.beginPath(); ctx.arc(512, 220, 140, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(512, 1828, 140, 0, Math.PI * 2); ctx.stroke();

    return new THREE.CanvasTexture(canvas);
}

const fieldGeo = new THREE.PlaneGeometry(FIELD_W, FIELD_L);
const fieldMat = new THREE.MeshLambertMaterial({ map: generateFieldTexture() });
const field = new THREE.Mesh(fieldGeo, fieldMat);
field.rotation.x = -Math.PI / 2;
scene.add(field);

// Target Circle on Ground
const targetRing = new THREE.Mesh(
    new THREE.RingGeometry(0.8, 1.1, 32),
    new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide })
);
targetRing.rotation.x = -Math.PI / 2;
targetRing.position.y = 0.05;
scene.add(targetRing);

// Goals Construction
function buildGoal(zPos) {
    const goal = new THREE.Group();
    const frameMat = new THREE.MeshLambertMaterial({ color: 0xef4444 });
    const pGeo = new THREE.CylinderGeometry(0.12, 0.12, 3.2, 12);
    
    const lp = new THREE.Mesh(pGeo, frameMat); lp.position.set(-2, 1.6, 0);
    const rp = new THREE.Mesh(pGeo, frameMat); rp.position.set(2, 1.6, 0);
    const tb = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4.2, 12), frameMat);
    tb.rotation.z = Math.PI / 2; tb.position.set(0, 3.2, 0);

    goal.add(lp, rp, tb);
    goal.position.set(0, 0, zPos);
    return goal;
}
const userGoal = buildGoal(HALF_L - 6);
const aiGoal = buildGoal(-HALF_L + 6);
scene.add(userGoal, aiGoal);

// --- PLAYERS & BALL ---
function createPlayer(color) {
    const p = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: color });

    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.4, 1.4, 12), mat);
    body.position.y = 1.2;
    p.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), new THREE.MeshLambertMaterial({ color: 0x1e293b }));
    head.position.y = 2.1;
    p.add(head);

    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.2, 8), new THREE.MeshLambertMaterial({ color: 0xe2e8f0 }));
    stick.position.set(0.5, 1.3, -0.3);
    stick.rotation.x = Math.PI / 4;
    p.add(stick);
    p.stick = stick;

    return p;
}

const userTeam = [createPlayer(0x2563eb), createPlayer(0x2563eb), createPlayer(0x2563eb)];
const aiTeam = [createPlayer(0xd97706), createPlayer(0xd97706), createPlayer(0xd97706)];

userTeam.forEach((p, i) => { p.position.set((i - 1) * 12, 0, 15); scene.add(p); });
aiTeam.forEach((p, i) => { p.position.set((i - 1) * 12, 0, -15); scene.add(p); });

let activeUserIdx = 0;
let ballCarrier = userTeam[0];

const ball = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xfacc15 })
);
scene.add(ball);

let ballVel = new THREE.Vector3(), ballInAir = false, shotModeTarget = new THREE.Vector3();

// --- CONTROLS & RAYCASTING ---
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

window.addEventListener('mousemove', (e) => {
    mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
    mousePos.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mousePos, camera);
    raycaster.ray.intersectPlane(groundPlane, groundTarget);
    targetRing.position.x = groundTarget.x;
    targetRing.position.z = groundTarget.z;
});

window.addEventListener('keydown', (e) => {
    keyState[e.code] = true;

    // Toggle Shot Mode on Enemy Half
    if (e.code === 'KeyF' && ballCarrier === userTeam[activeUserIdx]) {
        if (userTeam[activeUserIdx].position.z < 0) {
            if (gameState === "OFFENSE") {
                gameState = "SHOT_MODE";
                document.getElementById('reticle').style.display = 'block';
                document.getElementById('status-banner').innerText = "1ST PERSON SHOT MODE: Aim with Mouse | Hold Space to Shoot | F to Cancel";
            } else if (gameState === "SHOT_MODE") {
                gameState = "OFFENSE";
                document.getElementById('reticle').style.display = 'none';
                document.getElementById('status-banner').innerText = "WASD: Move | Mouse: Aim/Stick | Space: Pass/Check | F: Shot Mode";
            }
        }
    }

    if (e.code === 'Space' && !meterCharging && !ballInAir) {
        meterCharging = true;
        spacePressTime = performance.now();
        meterPower = 0;
        document.getElementById('meter-container').style.display = 'block';
    }
});

window.addEventListener('keyup', (e) => {
    keyState[e.code] = false;

    if (e.code === 'Space' && meterCharging) {
        const pressDuration = performance.now() - spacePressTime;
        executePassOrShot(pressDuration < 200); // Short tap check
        meterCharging = false;
        document.getElementById('meter-container').style.display = 'none';
    }
});

// --- PASSING & SHOOTING LOGIC ---
function executePassOrShot(isTap) {
    ballInAir = true;
    const shooter = userTeam[activeUserIdx];
    
    if (gameState === "SHOT_MODE") {
        // First-Person Shot on AI Goal
        const targetPoint = new THREE.Vector3(groundTarget.x, 1.5, aiGoal.position.z);
        const dir = new THREE.Vector3().subVectors(targetPoint, shooter.position).normalize();
        const speed = 0.7 + (meterPower / 100) * 0.8;
        ballVel.copy(dir.multiplyScalar(speed));

        gameState = "OFFENSE";
        document.getElementById('reticle').style.display = 'none';

        // Goalie Save Chance calculated by power & distance
        const dist = shooter.position.distanceTo(aiGoal.position);
        const saveProbability = Math.max(0.15, 0.85 - (meterPower / 120) + (dist / 120));
        
        setTimeout(() => {
            if (ballInAir && Math.random() < saveProbability) {
                // Goalie Saves
                ballInAir = false;
                ballCarrier = aiTeam[0];
                gameState = "DEFENSE";
                document.getElementById('status-banner').innerText = "SAVED BY GOALIE! Switch to Defense!";
            }
        }, 650);

    } else if (gameState === "OFFENSE") {
        // Pass Logic
        let nearestTeammate = null;
        let minDist = 12.0;

        userTeam.forEach((p, idx) => {
            if (idx !== activeUserIdx) {
                const d = p.position.distanceTo(groundTarget);
                if (d < minDist) { minDist = d; nearestTeammate = idx; }
            }
        });

        const passTarget = nearestTeammate !== null ? userTeam[nearestTeammate].position : groundTarget;
        const dir = new THREE.Vector3().subVectors(passTarget, shooter.position).normalize();

        if (isTap) {
            // Light, slow, arced lob pass
            ballVel.copy(dir.multiplyScalar(0.38));
            ballVel.y = 0.18;
        } else {
            // Power Pass
            const speed = 0.45 + (meterPower / 100) * 0.45;
            ballVel.copy(dir.multiplyScalar(speed));
            ballVel.y = 0.06;
        }

        if (nearestTeammate !== null) {
            activeUserIdx = nearestTeammate;
        }
    }
}

function triggerEnemyShot() {
    gameState = "GOALIE_SAVE";
    document.getElementById('reticle').style.display = 'block';
    document.getElementById('status-banner').innerText = "ENEMY SHOT! Move mouse reticle over the incoming ball to SAVE!";
    
    ballCarrier = null;
    ballInAir = true;
    ball.position.set(0, 1.5, -15);
    ballVel.set((Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.2, 0.7);

    setTimeout(() => {
        if (gameState === "GOALIE_SAVE") {
            // Enemy Scored
            aiScore++;
            document.getElementById('score-ai').innerText = aiScore;
            resetRound(userTeam[0]);
        }
    }, 1800);
}

function resetRound(carrier) {
    gameState = "OFFENSE";
    ballCarrier = carrier;
    ballInAir = false;
    ballVel.set(0, 0, 0);
    document.getElementById('reticle').style.display = 'none';
    document.getElementById('status-banner').innerText = "WASD: Move | Mouse: Aim/Stick | Space: Pass/Check | F: Shot Mode";
    userTeam[0].position.set(0, 0, 12);
    aiTeam[0].position.set(0, 0, -12);
}

// --- MAIN LOOP ---
let lastTime = performance.now();

function animate(time) {
    requestAnimationFrame(animate);
    const delta = (time - lastTime) / 1000;
    lastTime = time;

    // Period & Time Engine
    if (clockTime > 0) {
        clockTime -= delta;
        const mins = Math.floor(clockTime / 60).toString().padStart(2, '0');
        const secs = Math.floor(clockTime % 60).toString().padStart(2, '0');
        document.getElementById('game-clock').innerText = `${mins}:${secs}`;
    } else if (period < 3) {
        period++;
        clockTime = 120;
        document.getElementById('game-period').innerText = `${period} / 3`;
        resetRound(userTeam[0]);
    }

    // Active User Movement
    const player = userTeam[activeUserIdx];
    const moveSpeed = 0.22;

    if (gameState === "OFFENSE" || gameState === "DEFENSE") {
        if (keyState['KeyW']) player.position.z -= moveSpeed;
        if (keyState['KeyS']) player.position.z += moveSpeed;
        if (keyState['KeyA']) player.position.x -= moveSpeed;
        if (keyState['KeyD']) player.position.x += moveSpeed;

        // Stick Protection / Check Rotation by Mouse X
        if (player.stick) {
            const sideTilt = (groundTarget.x - player.position.x) * 0.06;
            player.stick.rotation.z = Math.max(-0.9, Math.min(0.9, sideTilt));
        }
    }

    // Defensive Checking
    if (gameState === "DEFENSE" && keyState['Space']) {
        const enemy = aiTeam[0];
        if (player.position.distanceTo(enemy.position) < 2.0) {
            // Dislodge ball
            ballCarrier = player;
            gameState = "OFFENSE";
            document.getElementById('status-banner').innerText = "SUCCESSFUL CHECK! You got possession!";
        }
    }

    // Ball Mechanics
    if (!ballInAir && ballCarrier) {
        ball.position.copy(ballCarrier.position).add(new THREE.Vector3(0.3, 1.2, -0.3));
    } else if (ballInAir) {
        ball.position.add(ballVel);
        if (ballVel.y > -0.2) ballVel.y -= 0.008; // Gravity Arc

        // Catch Transfer
        userTeam.forEach((p, idx) => {
            if (p.position.distanceTo(ball.position) < 1.6 && ballVel.y < 0.1) {
                ballCarrier = p;
                activeUserIdx = idx;
                ballInAir = false;
                gameState = "OFFENSE";
            }
        });

        // User Goal Score
        if (ball.position.z <= aiGoal.position.z + 0.8 && Math.abs(ball.position.x) < 2.2 && ball.position.y < 3.2) {
            userScore++;
            document.getElementById('score-user').innerText = userScore;
            resetRound(userTeam[0]);
        }
    }

    // Goalie First Person Save Intercept Mechanics
    if (gameState === "GOALIE_SAVE") {
        const reticleDist = new THREE.Vector2((mousePos.x * window.innerWidth/2), (mousePos.y * window.innerHeight/2));
        if (reticleDist.length() < 90 && ball.position.z > HALF_L - 10) {
            // Saved!
            document.getElementById('status-banner').innerText = "GREAT SAVE! Ball recovered!";
            resetRound(userTeam[0]);
        }
    }

    // Shot Meter Cycle
    if (meterCharging) {
        meterPower += meterDir * 2.8;
        if (meterPower >= 100 || meterPower <= 0) meterDir *= -1;
        document.getElementById('meter-bar').style.width = meterPower + '%';
    }

    // AI Automation
    if (gameState === "DEFENSE" && ballCarrier === aiTeam[0]) {
        const dir = new THREE.Vector3(0, 0, HALF_L - 10).sub(aiTeam[0].position).normalize();
        aiTeam[0].position.add(dir.multiplyScalar(0.12));

        if (aiTeam[0].position.z > 0 && Math.random() < 0.008) {
            triggerEnemyShot();
        }
    }

    // Dynamic Camera Modes
    if (gameState === "SHOT_MODE") {
        // 1st Person Shooter View
        camera.position.copy(player.position).add(new THREE.Vector3(0, 1.7, 0));
        camera.lookAt(0, 1.6, aiGoal.position.z);
    } else if (gameState === "GOALIE_SAVE") {
        // 1st Person Goalie View
        camera.position.set(0, 1.8, HALF_L - 5);
        camera.lookAt(0, 1.5, 0);
    } else {
        // Third Person Madden Follow View
        camera.position.copy(player.position).add(new THREE.Vector3(0, 13, 17));
        camera.lookAt(player.position.x, 1, player.position.z - 5);
    }

    renderer.render(scene, camera);
}

// Window Resizing
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate(performance.now());
</script>
</body>
</html>
